spring.application.name=digital-library-management-system

# File-based H2 database so data persists between restarts (no external DB server needed)
spring.datasource.url=jdbc:h2:file:./data/librarydb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Optional H2 web console for inspecting data at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
